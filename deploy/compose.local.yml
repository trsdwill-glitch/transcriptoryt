# Local Docker check: no domain, TLS certificate or production credentials needed.
name: transcriptor-local
services:
  app:
    image: transcriptor:local-check
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: production
    environment:
      ENV: development
      TRUSTED_PROXY: "false"
      DATA_DIR: /data
      DAILY_QUOTA_MIN: "120"
      MAX_FILE_MIN: "120"
      MAX_UPLOAD_MB: "500"
    ports: [127.0.0.1:8080:8000]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,uid=10001,gid=10001,mode=1770
    volumes: [local_data:/data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 192
volumes:
  local_data:
